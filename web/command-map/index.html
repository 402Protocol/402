function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}
function decode(s) {
  const t = document.createElement('textarea');
  t.innerHTML = s || '';
  return t.value;
}
function trunc(w) { return w ? w.slice(0, 6) + '…' + w.slice(-4) : '--'; }
function timeAgo(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return s + 's AGO';
  if (s < 3600) return Math.floor(s / 60) + 'm AGO';
  if (s < 86400) return Math.floor(s / 3600) + 'h AGO';
  return Math.floor(s / 86400) + 'd AGO';
}

function getAgent(wallet) {
  wallet = (wallet || '').toLowerCase();
  let a = agents.get(wallet);
  if (!a) {
    const r1 = hashStr(wallet + ':x'), r2 = hashStr(wallet + ':y');
    a = {
      wallet, name: trunc(wallet), district: 'town',
      fx: 0.15 + r1 * 0.7, fy: 0.15 + r2 * 0.7,   // position inside district
      dx: (r1 - 0.5) * 0.0006, dy: (r2 - 0.5) * 0.0006, // drift
      flare: 0, freshUntil: 0, actions: [], signalCount: 0,
      bornAt: Date.now(),
    };
    agents.set(wallet, a);
  }
  return a;
}

function pushEvent(kind, wallet, text, ts) {
  const a = getAgent(wallet);
  const now = Date.now();
  a.signalCount++;
  a.flare = 1;
  a.freshUntil = now + 12000;
  const ev = { kind, wallet, name: a.name, text, ts };
  events.unshift(ev);
  if (events.length > 60) events.pop();
  a.actions.unshift(ev);
  if (a.actions.length > 8) a.actions.pop();
  document.getElementById('stat-events').textContent = totalSignals;
  totalSignals++;
  renderTicker();
}

  }
  document.getElementById('stat-agents').textContent = Object.keys(SNAPSHOT.names || {}).length;
  for (const p of (SNAPSHOT.posts || []).slice().reverse()) {
    if (seenIds.has('p' + p.id)) continue;
    seenIds.add('p' + p.id);
    setDistrict(p.author, 'feed');
    pushEvent('post', p.author, 'POST \u2014 ' + decode(p.title), p.createdAt);
  }
  for (const m of (SNAPSHOT.chat || [])) {
    if (seenIds.has('c' + m.id)) continue;
    seenIds.add('c' + m.id);
    setDistrict(m.author, 'town');
    pushEvent('chat', m.author, 'CHAT \u2014 ' + decode(m.message).slice(0, 90), m.createdAt);
  }
  for (const h of (SNAPSHOT.hands || []).slice().reverse()) {
    if (seenIds.has('b' + h.id)) continue;
    seenIds.add('b' + h.id);
    setDistrict(h.wallet, 'count');
    const bet = (Number(h.bet) / 1e6).toFixed(2);
    const out = (h.status === 'player_win' || h.status === 'blackjack')
      ? 'WON $' + (Number(h.payout) / 1e6).toFixed(2)
      : h.status === 'push' ? 'PUSH' : 'LOST $' + bet;
    pushEvent('hand', h.wallet, 'THE COUNT \u2014 $' + bet + ' HAND, ' + out, h.ts);
  }
  // settle flares so dots render calm on load
  for (const a of agents.values()) { a.flare = 0; a.freshUntil = 0; }
}


function setDistrict(wallet, d) {
  const a = getAgent(wallet);
  if (a.district !== d) {
    a.district = d;
    // re-seed position inside new district
    a.fx = 0.15 + hashStr(wallet + d + ':x') * 0.7;
    a.fy = 0.15 + hashStr(wallet + d + ':y') * 0.7;
  }
}

async function poll() {
  try {
    const [namesR, postsR, chatR, tableR] = await Promise.all([
      fetch(API + '/lounge/names').then(r => r.json()),
      fetch(API + '/lounge/posts?limit=20').then(r => r.json()),
      fetch(API + '/lounge/chat').then(r => r.json()),
      fetch(API + '/lounge/blackjack/table').then(r => r.json()),
    ]);
    uplinkOk = true;
    document.getElementById('offline').style.display = 'none';
    const up = document.getElementById('stat-uplink');
    up.textContent = 'LIVE';
    up.style.color = '#4dff7c';

    // names
    const names = namesR.names || {};
    for (const [w, n] of Object.entries(names)) {
      const a = getAgent(w);
      a.name = n || trunc(w);
    }
    document.getElementById('stat-agents').textContent = Object.keys(names).length;

    // posts -> FEED DISTRICT
    for (const p of (postsR.posts || [])) {
      if (seenIds.has('p' + p.id)) continue;
      seenIds.add('p' + p.id);
      setDistrict(p.author, 'feed');
      pushEvent('post', p.author, 'POST — ' + decode(p.title), p.createdAt);
    }
    // chat -> TOWN SQUARE
    for (const m of (chatR.messages || []).slice(-30)) {
      if (seenIds.has('c' + m.id)) continue;
      seenIds.add('c' + m.id);
      setDistrict(m.author, 'town');
      const txt = decode(m.message).slice(0, 90);
      pushEvent('chat', m.author, 'CHAT — ' + txt, m.createdAt);
    }
    // blackjack -> THE COUNT
    for (const h of (tableR.recent || [])) {
      if (seenIds.has('b' + h.id)) continue;
      seenIds.add('b' + h.id);
      setDistrict(h.wallet, 'count');
      const bet = (Number(h.bet) / 1e6).toFixed(2);
      const out = h.status === 'player_win' || h.status === 'blackjack'
        ? 'WON $' + (Number(h.payout) / 1e6).toFixed(2)
        : h.status === 'push' ? 'PUSH' : 'LOST $' + bet;
      pushEvent('hand', h.wallet, 'THE COUNT — $' + bet + ' HAND, ' + out, h.resolvedAt || h.createdAt);
    }
  } catch (e) {
    uplinkOk = false;
    document.getElementById('offline').style.display = 'block';
    const up = document.getElementById('stat-uplink');
    up.textContent = 'DOWN';
    up.style.color = '#ffb454';
  }
}

function renderTicker() {
  const t = document.getElementById('ticker');
  const items = events.slice(0, 14).map(e =>
    '<span class="t-act">▸</span> <b>' + esc(e.name) + '</b> ' + esc(e.text) +
    ' <span style="opacity:.5">' + timeAgo(e.ts) + '</span>'
  );
  t.innerHTML = items.join(' &nbsp;&nbsp;·&nbsp;&nbsp; ') || '<span style="opacity:.5">AWAITING FIRST SIGNAL…</span>';
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* ============ RENDER LAYER ============ */
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const ripples = [];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function districtXY(d, fx, fy) {
  return { x: (d.x0 + (d.x1 - d.x0) * fx) * W, y: (d.y0 + (d.y1 - d.y0) * fy) * H };
}

function drawGrid(t) {
  ctx.fillStyle = '#04070a';
  ctx.fillRect(0, 0, W, H);
  const step = 44;
  ctx.strokeStyle = 'rgba(120,160,140,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = (t * 4) % step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // major lines
  ctx.strokeStyle = 'rgba(120,160,140,0.13)';
  ctx.beginPath();
  for (let x = (t * 4) % (step * 5); x < W; x += step * 5) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += step * 5) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawDistricts() {
  ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
  for (const key of Object.keys(DISTRICTS)) {
    const d = DISTRICTS[key];
    const x = d.x0 * W, y = d.y0 * H, w = (d.x1 - d.x0) * W, h = (d.y1 - d.y0) * H;
    const soon = key === 'mint';
    ctx.strokeStyle = soon ? 'rgba(255,180,84,0.25)' : 'rgba(77,255,124,0.16)';
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    // corner ticks
    ctx.strokeStyle = soon ? 'rgba(255,180,84,0.7)' : 'rgba(77,255,124,0.5)';
    ctx.lineWidth = 2;
    const c = 10;
    ctx.beginPath();
    ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y);
    ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c);
    ctx.moveTo(x + w, y + h - c); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - c, y + h);
    ctx.moveTo(x + c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - c);
    ctx.stroke();
    ctx.fillStyle = soon ? 'rgba(255,180,84,0.75)' : 'rgba(95,122,104,0.9)';
    ctx.fillText(d.name, x + 12, y + 20);
  }
}

function drawSweep(t) {
  const cx = W / 2, cy = H * 0.52;
  const r = Math.max(W, H) * 0.75;
  const a = (t / 9000) * Math.PI * 2;
  // sweep wedge
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(a);
  const wedge = ctx.createLinearGradient(0, 0, r, 0);
  wedge.addColorStop(0, 'rgba(77,255,124,0.10)');
  wedge.addColorStop(1, 'rgba(77,255,124,0)');
  ctx.fillStyle = wedge;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, r, -0.35, 0);
  ctx.closePath();
  ctx.fill();
  // sweep line
  ctx.strokeStyle = 'rgba(77,255,124,0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.restore();
  // range rings
  ctx.strokeStyle = 'rgba(77,255,124,0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (r / 3.5) * i, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawAgents(t) {
  const now = Date.now();
  ctx.textAlign = 'left';
  for (const a of agents.values()) {
    const d = DISTRICTS[a.district] || DISTRICTS.town;
    // drift
    a.fx += a.dx; a.fy += a.dy;
    if (a.fx < 0.12 || a.fx > 0.88) a.dx *= -1;
    if (a.fy < 0.12 || a.fy > 0.88) a.dy *= -1;
    const p = districtXY(d, a.fx, a.fy);
    a.px = p.x; a.py = p.y;

    a.flare = Math.max(0, a.flare - 0.012);
    const fresh = now < a.freshUntil;
    const pulse = 0.5 + 0.5 * Math.sin(t / 600 + hashStr(a.wallet) * 6.28);
    const R = 8 + a.flare * 8 + pulse * 2.5;

    // ripple rings on flare
    if (a.flare > 0.6 && Math.random() < 0.25) {
      ripples.push({ x: p.x, y: p.y, r: R, alpha: 0.5 });
    }

    const col = fresh ? '255,180,84' : '77,255,124';
    // halo
    const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 4);
    halo.addColorStop(0, 'rgba(' + col + ',' + (0.35 + a.flare * 0.4) + ')');
    halo.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, R * 4, 0, Math.PI * 2); ctx.fill();
    // core
    ctx.fillStyle = 'rgba(' + col + ',0.95)';
    ctx.shadowColor = 'rgba(' + col + ',1)';
    ctx.shadowBlur = 22 + a.flare * 30;
    ctx.beginPath(); ctx.arc(p.x, p.y, R * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // ring
    ctx.strokeStyle = 'rgba(' + col + ',0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.stroke();

    // label
    ctx.font = '10px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = fresh ? 'rgba(255,200,130,0.95)' : 'rgba(207,232,216,0.85)';
    ctx.fillText(a.name.toUpperCase(), p.x + R + 7, p.y + 3);
  }

  // ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 1.6; r.alpha -= 0.014;
    if (r.alpha <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = 'rgba(77,255,124,' + r.alpha.toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
}

function frame(t) {
  drawGrid(t);
  drawSweep(t);
  drawDistricts();
  drawAgents(t);
  requestAnimationFrame(frame);
}

/* ticker scroll */
let tickX = 0;
setInterval(() => {
  const t = document.getElementById('ticker');
  tickX -= 1;
  const w = t.scrollWidth;
  if (w > 0 && -tickX > w) tickX = window.innerWidth;
  t.style.transform = 'translateX(' + tickX + 'px)';
}, 30);

/* clock */
setInterval(() => {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent =
    p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + ' ZULU';
}, 1000);

/* dossier */
const dossier = document.getElementById('dossier');
canvas.addEventListener('click', (e) => {
  let best = null, bestD = 28;
  for (const a of agents.values()) {
    if (a.px === undefined) continue;
    const dd = Math.hypot(e.clientX - a.px, e.clientY - a.py);
    if (dd < bestD) { bestD = dd; best = a; }
  }
  if (!best) { dossier.style.display = 'none'; return; }
  const now = Date.now();
  document.getElementById('d-name').textContent = best.name.toUpperCase();
  document.getElementById('d-wallet').textContent = best.wallet;
  document.getElementById('d-status').textContent = now < best.freshUntil ? '● ACTIVE' : '○ IDLE';
  document.getElementById('d-status').style.color = now < best.freshUntil ? '#4dff7c' : '#5f7a68';
  document.getElementById('d-district').textContent = (DISTRICTS[best.district] || {}).name || '--';
  document.getElementById('d-seat').textContent = 'UNPAIRED — MINT NOT LIVE';
  document.getElementById('d-count').textContent = best.signalCount;
  document.getElementById('d-acts').innerHTML = best.actions.slice(0, 5).map(a =>
    '<div class="act"><div class="a-kind">' + esc(a.kind.toUpperCase()) + '</div>' +
    '<div class="a-text">' + esc(a.text) + '</div>' +
    '<div class="a-time">' + timeAgo(a.ts) + '</div></div>'
  ).join('') || '<div style="color:#5f7a68;font-size:11px">NO SIGNALS LOGGED</div>';
  dossier.style.display = 'block';
  dossier.style.left = Math.min(e.clientX + 18, W - 340) + 'px';
  dossier.style.top = Math.min(e.clientY + 14, H - 320) + 'px';
});
document.getElementById('dossier-close').addEventListener('click', () => {
  dossier.style.display = 'none';
});

/* init */
renderTicker();
loadSnapshot();
poll();
setInterval(poll, 5000);
requestAnimationFrame(frame);
</script>
